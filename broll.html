<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BLOCK 00:00–01:00 — rich bright cut</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/anton/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono/400.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#050607}
:root{
  --void:#0a0d10; --surface:#1a2126; --line:#37424a; --ink:#f4f1e7;
  --muted:#98a1a8; --acc:#ff4a2a; --acc2:#ffb830; --hero:#3de8c0; --ok:#5af57e;
  --flash:#fdfaf1;
  --slam:cubic-bezier(.2,1.35,.35,1); --draw:cubic-bezier(.45,.05,.4,1);
  --risek:cubic-bezier(.16,.9,.26,1); --drift:ease-in-out;
  --disp:'Anton',sans-serif; --mono:'IBM Plex Mono',monospace;
}
.fit{aspect-ratio:16/9;container-type:size;overflow:hidden;
  width:100vw;max-width:calc(100vh*16/9);margin:0 auto;
  position:relative;background:var(--void)}
.safe{position:absolute;inset:0 0 25% 0}
body.cdp .guides, body.cdp .vtag{display:none}

/* ambient floor — glow pools + whisper grid */
.floor{position:absolute;inset:-12%;z-index:0;
  background:
    radial-gradient(90cqh at 78% 30%, color-mix(in srgb,var(--acc2) 8%,transparent), transparent 60%),
    radial-gradient(80cqh at 18% 70%, color-mix(in srgb,var(--hero) 7%,transparent), transparent 60%),
    linear-gradient(color-mix(in srgb,var(--ink) 4%,transparent) .16cqh, transparent .16cqh),
    linear-gradient(90deg, color-mix(in srgb,var(--ink) 4%,transparent) .16cqh, transparent .16cqh);
  background-size:100% 100%,100% 100%,14.2cqh 14.2cqh,14.2cqh 14.2cqh;
  animation:floorDrift 60s linear 0s both}
@keyframes floorDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-6cqh,-3cqh,0)}}
.mote{position:absolute;width:.5cqh;height:.5cqh;border-radius:50%;
  background:color-mix(in srgb,var(--ink) 50%,transparent);opacity:0;
  animation:moteK 60s linear var(--d) both}
@keyframes moteK{0%{transform:translate(0,0);opacity:0}6%{opacity:.5}
  94%{opacity:.5}100%{transform:translate(var(--mx),var(--my));opacity:0}}
.vig{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(120% 120% at 50% 42%, transparent 55%, color-mix(in srgb,var(--void) 68%,transparent) 100%)}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}

.stage{position:absolute;inset:0;z-index:1;animation:cam 60s var(--drift) 0s both}
@keyframes cam{0%{transform:scale(1)}88%{transform:scale(1.06)}100%{transform:scale(1)}}
.shot{position:absolute;inset:0;z-index:1;animation:shotOut .5s var(--drift) var(--out) both}
.sin{position:absolute;inset:0;padding:4cqh 5cqw 7cqh;opacity:0;
  animation:shotIn .6s var(--risek) var(--in) both}
@keyframes shotIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes shotOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-1.6cqh)}}
.disp{font-family:var(--disp);text-transform:uppercase;font-weight:400}
.rise{opacity:0;animation:riseIn .6s var(--risek) var(--d) both}
@keyframes riseIn{from{opacity:0;transform:translateY(2.4cqh)}to{opacity:1;transform:none}}
.slamBig{opacity:0;animation:slamBigK .55s var(--slam) var(--d) both}
@keyframes slamBigK{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
.strokeDraw{stroke-dasharray:1;stroke-dashoffset:1;animation:strokeIn .8s var(--draw) var(--d) both}
@keyframes strokeIn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.ruleDrawV{transform:scaleY(0);transform-origin:center top;animation:ruleInV .6s var(--draw) var(--d) both}
@keyframes ruleInV{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ruleIn{transform:scaleX(0);transform-origin:left center;animation:ruleInK .5s var(--draw) var(--d) both}
@keyframes ruleInK{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.barDrop{transform:scaleY(0);transform-origin:center top;animation:barDropK .45s var(--slam) var(--d) both}
@keyframes barDropK{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.popIn{opacity:0;transform-box:fill-box;transform-origin:center;animation:popInK .4s var(--slam) var(--d) both}
@keyframes popInK{from{opacity:0;transform:scale(2.4)}to{opacity:1;transform:scale(1)}}
.pool{position:absolute;border-radius:50%;opacity:0;
  background:radial-gradient(closest-side, color-mix(in srgb,var(--gc) 26%,transparent), transparent 72%);
  animation:poolIn 1.2s var(--drift) var(--d) both}
@keyframes poolIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

/* ——— TOON AGENT ——— */
.agent{position:relative}
.agent svg{display:block;width:100%;height:100%;overflow:visible}
.aBody{fill:var(--hero);stroke:var(--void);stroke-width:3}
.aFace{fill:color-mix(in srgb,var(--hero) 48%,var(--void))}
.aDark{fill:var(--void)}
.evil .aBody{fill:var(--acc)}
.evil .aFace{fill:color-mix(in srgb,var(--acc) 50%,var(--void))}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.4s ease-in-out infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
.eyeW{fill:var(--ink)} .pupil{fill:var(--void)} .shine{fill:var(--ink)}
.eyeTurn .eyeW{animation:eyeTurnK .35s linear var(--d) both}
@keyframes eyeTurnK{from{fill:var(--ink)}to{fill:var(--acc)}}
.aCore{fill:var(--acc2);animation:coreP 1.8s ease-in-out infinite alternate}
@keyframes coreP{from{opacity:.55}to{opacity:1}}
.aTip{fill:var(--acc2)}
.aHalo{fill:none;stroke:var(--acc2);opacity:0;transform-box:fill-box;transform-origin:center;
  animation:haloK 2.2s var(--drift) var(--d) infinite}
@keyframes haloK{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.ashadow{position:absolute;left:50%;bottom:-1.6cqh;width:110%;height:1.6cqh;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(closest-side, color-mix(in srgb,var(--void) 80%,transparent), transparent)}

/* ——— SHOT A · HEIST SCENE ——— */
.sceneA{display:block}
.groundA{position:absolute;left:6cqw;right:6cqw;bottom:10cqh;height:.18cqh;
  background:linear-gradient(90deg,transparent, color-mix(in srgb,var(--acc2) 55%,var(--line)) 30%,
    color-mix(in srgb,var(--acc2) 55%,var(--line)) 70%, transparent);
  opacity:0;animation:riseIn .7s var(--risek) 2.67s both}
.groundGlow{position:absolute;left:6cqw;right:6cqw;bottom:10.2cqh;height:4cqh;
  background:linear-gradient(to top, color-mix(in srgb,var(--acc2) 9%,transparent), transparent);
  opacity:0;animation:fadeInK 1s var(--drift) 2.80s both}
@keyframes fadeInK{from{opacity:0}to{opacity:1}}
.sky{position:absolute;bottom:10.2cqh;display:flex;gap:.9cqw;align-items:flex-end;
  opacity:0;animation:fadeInK 1.2s var(--drift) 2.70s both}
.skyL{left:7cqw}.skyR{right:33cqw}
.tw{position:relative;background:var(--surface);border:.14cqh solid var(--line);
  background-image:repeating-linear-gradient(180deg, transparent 0 1cqh,
    color-mix(in srgb,var(--acc2) 26%,transparent) 1cqh 1.35cqh)}
.bk{position:absolute;top:-1.2cqh;left:50%;width:.7cqh;height:.7cqh;margin-left:-.35cqh;
  border-radius:50%;background:var(--acc);animation:bkP 2s ease-in-out var(--d) infinite alternate}
@keyframes bkP{from{opacity:.25}to{opacity:.95}}
.beam{position:absolute;right:10.5cqw;bottom:20cqh;width:20cqw;height:34cqh;
  clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
  background:linear-gradient(to bottom, color-mix(in srgb,var(--acc2) 24%,transparent), transparent 88%);
  opacity:0;animation:beamK 1s var(--drift) 3.00s both, beamP 3.4s ease-in-out 4.20s infinite alternate}
@keyframes beamK{from{opacity:0;transform:scaleY(.6)}to{opacity:1;transform:scaleY(1)}}
@keyframes beamP{from{opacity:.75}to{opacity:1}}
.pedWrap{position:absolute;right:15cqw;bottom:10cqh;width:13cqw;height:24cqh;
  opacity:0;animation:riseIn .7s var(--risek) 2.90s both}
.ped{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:11cqw;height:10cqh;background:var(--surface);border:.22cqh solid var(--line);
  border-top:.4cqh solid color-mix(in srgb,var(--acc2) 60%,var(--line))}
.keyW{position:absolute;left:50%;bottom:11cqh;width:6cqh;transform:translateX(-50%);
  animation:keyGrab .55s var(--slam) 8.20s both}
@keyframes keyGrab{from{transform:translateX(-50%) translateY(0) scale(1)}
  to{transform:translateX(-50%) translateY(-4.4cqh) scale(1.35);
     filter:drop-shadow(0 0 1.6cqh color-mix(in srgb,var(--acc2) 75%,transparent))}}
.keyS{stroke:var(--acc2);stroke-width:4.4;stroke-linecap:round;fill:none;
  filter:drop-shadow(0 0 .5cqh color-mix(in srgb,var(--acc2) 55%,transparent))}
.spk{position:absolute;opacity:0;animation:twk 1.5s ease-in-out var(--d) infinite alternate}
@keyframes twk{from{opacity:.15;transform:scale(.55) rotate(0deg)}
  to{opacity:1;transform:scale(1.15) rotate(45deg)}}
.xmark{position:absolute;right:15.5cqw;bottom:26cqh;width:11cqh;height:11cqh;overflow:visible;
  filter:drop-shadow(0 0 .7cqh color-mix(in srgb,var(--acc) 55%,transparent))}
.wallW{position:absolute;left:50%;bottom:10cqh;height:40cqh;transform:translateX(-50%);
  animation:wallBreak .3s linear 7.30s both}
.wallLine{width:0;height:100%;border-left:.5cqh dashed color-mix(in srgb,var(--hero) 55%,var(--line))}
@keyframes wallBreak{from{opacity:1}to{opacity:0}}
.wr{position:absolute;left:50%;bottom:24cqh;width:16cqh;height:16cqh;margin:-8cqh;
  border:.4cqh solid var(--acc2);border-radius:50%;opacity:0;
  animation:wrK .6s var(--draw) 7.30s both}
@keyframes wrK{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.frgset{position:absolute;left:50%;bottom:26cqh;opacity:0;animation:fragShow .95s linear 7.30s both}
@keyframes fragShow{0%{opacity:0}6%{opacity:1}100%{opacity:0}}
.frg{position:absolute;width:1.2cqh;height:.8cqh;background:var(--acc2);border-radius:.2cqh;
  animation:fragK .8s var(--draw) var(--d) both}
@keyframes fragK{from{transform:translate(0,0) rotate(0deg)}
  to{transform:translate(var(--dx),var(--dy)) rotate(var(--rr));opacity:0}}
.spdW{position:absolute;left:9cqw;bottom:13cqh;width:20cqw;height:8cqh}
.spd{position:absolute;height:.42cqh;border-radius:.3cqh;background:var(--hero);opacity:0;
  animation:spdK .9s var(--draw) var(--d) both}
@keyframes spdK{0%{opacity:0;transform:translateX(3cqw) scaleX(.4)}20%{opacity:.85}
  100%{opacity:0;transform:translateX(-6cqw) scaleX(1)}}
.puffW{position:absolute;width:0;height:0}
.pf{position:absolute;width:1.1cqh;height:1.1cqh;border-radius:50%;
  background:color-mix(in srgb,var(--ink) 65%,transparent);opacity:0;
  animation:pfK .6s var(--draw) var(--d) both}
@keyframes pfK{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:.9}
  100%{opacity:0;transform:translate(var(--px),var(--py)) scale(1.2)}}
.agentA{position:absolute;left:12cqw;bottom:11cqh;width:12cqh;height:12.8cqh;
  animation:agentA 10.35s linear 0s both}
@keyframes agentA{
  0%,25.8%{transform:translateX(-18cqw) scale(1);opacity:0}
  27%{transform:translateX(-14cqw) scale(1);opacity:1}
  32.8%{transform:translateX(0) scale(1)}
  36%{transform:translateX(0) scale(1.06,.94)}
  56%{transform:translateX(0) scale(1)}
  62%{transform:translateX(6cqw) scale(1.1,.9)}
  70%{transform:translateX(26cqw) scale(1.12,.88)}
  76%{transform:translateX(40cqw) scale(1.05,.95)}
  79.5%{transform:translateX(40cqw) translateY(-2.6cqh) scale(.96,1.06)}
  83%{transform:translateX(40cqw) scale(1.05,.95)}
  86%,100%{transform:translateX(40cqw) scale(1)}}
/* mega stack */
.mega{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;z-index:3}
.mrays{position:absolute;width:130cqh;height:130cqh;opacity:0;
  background:repeating-conic-gradient(color-mix(in srgb,var(--acc2) 16%,transparent) 0deg 4deg, transparent 4deg 13deg);
  -webkit-mask-image:radial-gradient(closest-side, var(--ink), transparent 60%);
  mask-image:radial-gradient(closest-side, var(--ink), transparent 60%);
  animation:raysK 1.1s var(--draw) 8.20s both}
@keyframes raysK{0%{opacity:0;transform:scale(.55)}18%{opacity:.65}
  100%{opacity:0;transform:scale(1.18) rotate(9deg)}}
.mword{position:relative;display:block}
.mw{font-family:var(--disp);text-transform:uppercase;font-size:13cqh;line-height:1;
  letter-spacing:.4cqh;color:var(--ink);white-space:nowrap;
  text-shadow:0 0 2.4cqh color-mix(in srgb,var(--acc2) 35%,transparent)}
.riseMega{opacity:0;animation:megaIn .8s var(--slam) var(--d) both}
@keyframes megaIn{from{opacity:0;transform:scale(.9) translateY(2.6cqh);filter:blur(.8cqh)}
  to{opacity:1;transform:none;filter:blur(0)}}
.ghost{position:absolute;inset:0;opacity:0;animation:ghostK .14s linear var(--d) both}
.g-a{color:var(--acc);transform:translateX(-.6cqh)}
.g-b{color:var(--hero);transform:translateX(.6cqh)}
@keyframes ghostK{0%{opacity:0}35%{opacity:.4}100%{opacity:0}}
.ring{position:absolute;width:46cqh;height:46cqh;border:.4cqh solid var(--acc);
  border-radius:50%;opacity:0;animation:ringK .9s var(--draw) var(--d) both}
.r-b{border-color:var(--acc2);width:32cqh;height:32cqh}
@keyframes ringK{0%{transform:scale(.15);opacity:0}14%{opacity:.8}100%{transform:scale(1.65);opacity:0}}
.flash{position:absolute;inset:0;background:var(--flash);opacity:0;z-index:4;
  animation:flashK .45s var(--drift) var(--d) both}
@keyframes flashK{0%{opacity:0}10%{opacity:.8}100%{opacity:0}}

/* ——— SHOT B · CHECK + SLASH ——— */
.layMid{display:grid;place-items:center}
.bwrap{display:flex;flex-direction:column;align-items:center;gap:2.4cqh;position:relative}
.brays{position:absolute;left:50%;top:18cqh;width:90cqh;height:90cqh;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(color-mix(in srgb,var(--ok) 12%,transparent) 0deg 5deg, transparent 5deg 14deg);
  -webkit-mask-image:radial-gradient(closest-side, var(--ink), transparent 58%);
  mask-image:radial-gradient(closest-side, var(--ink), transparent 58%);
  opacity:0;animation:braysK 1.4s var(--draw) 10.90s both}
@keyframes braysK{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}22%{opacity:.5}
  100%{opacity:.14;transform:translate(-50%,-50%) scale(1.12) rotate(6deg)}}
.bring{position:absolute;left:50%;top:18cqh;width:44cqh;height:44cqh;margin:-22cqh;
  border:.35cqh solid var(--ok);border-radius:50%;opacity:0;
  animation:wrK .8s var(--draw) 10.90s both}
.bcheck{width:36cqh;height:36cqh;overflow:visible;position:relative;z-index:1;
  filter:drop-shadow(0 0 1.2cqh color-mix(in srgb,var(--ok) 55%,transparent));
  animation:checkTilt .45s var(--slam) 13.20s both}
@keyframes checkTilt{from{transform:rotate(0deg)}to{transform:rotate(-6deg)}}
.bslash{position:absolute;left:50%;top:18cqh;width:46cqh;height:36cqh;
  transform:translateX(-50%);overflow:visible;z-index:2;
  filter:drop-shadow(0 0 .8cqh color-mix(in srgb,var(--acc) 55%,transparent))}
.bspark{position:absolute;width:1cqh;height:1cqh;border-radius:50%;background:var(--acc);
  opacity:0;animation:pfK .5s var(--draw) var(--d) both}
.btrue{font-family:var(--disp);font-size:3.4cqh;letter-spacing:.9cqh;color:var(--muted)}

/* ——— SHOT C · SPEAKER ORB ——— */
.layC{display:grid;place-items:center;overflow:hidden}
.aur{position:absolute;width:110cqh;height:110cqh;border-radius:50%;
  background:radial-gradient(closest-side, color-mix(in srgb,var(--hero) 16%,transparent), transparent 70%);
  animation:aurK 7s ease-in-out 16.01s infinite alternate}
@keyframes aurK{from{transform:scale(.94) translate(-2cqh,1cqh);opacity:.7}
  to{transform:scale(1.08) translate(2cqh,-1cqh);opacity:1}}
.aur2{background:radial-gradient(closest-side, color-mix(in srgb,var(--acc2) 12%,transparent), transparent 70%);
  animation-duration:9s;animation-delay:17s}
.cwrap{position:relative;width:52cqh;height:52cqh;display:grid;place-items:center}
.oring{position:absolute;inset:4cqh;border:.28cqh solid var(--hero);border-radius:50%;
  opacity:0;animation:oringK 3.2s var(--drift) var(--d) infinite}
@keyframes oringK{0%{transform:scale(.72);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.ospin{position:absolute;inset:0;animation:ospinK var(--sp) linear var(--d) infinite}
@keyframes ospinK{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.ospin i{position:absolute;top:0;left:50%;width:1.1cqh;height:1.1cqh;margin-left:-.55cqh;
  border-radius:50%;background:var(--acc);box-shadow:0 0 1cqh color-mix(in srgb,var(--acc) 70%,transparent)}
.ospin i.t{background:var(--hero);box-shadow:0 0 1cqh color-mix(in srgb,var(--hero) 70%,transparent)}
.ospin i.g{background:var(--acc2);box-shadow:0 0 1cqh color-mix(in srgb,var(--acc2) 70%,transparent)}
.cagent{width:24cqh;height:25.6cqh;position:relative;z-index:1;
  filter:drop-shadow(0 0 1.4cqh color-mix(in srgb,var(--hero) 55%,transparent));
  opacity:0;animation:riseIn .8s var(--risek) 16.01s both}
.corePop{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:corePopK .5s var(--slam) 19.60s both}
@keyframes corePopK{from{opacity:0;transform:scale(2.6)}to{opacity:1;transform:scale(1)}}
.cword{margin-top:2.6cqh;font-family:var(--disp);font-size:7cqh;letter-spacing:1.4cqh;
  color:var(--ink);text-shadow:0 0 2cqh color-mix(in srgb,var(--hero) 30%,transparent)}

/* ——— SHOT D · THREE LENSES ——— */
.layD{display:grid;place-items:center}
.drow{display:flex;gap:6cqw;align-items:center}
.lensW{position:relative;width:26cqh;display:flex;flex-direction:column;align-items:center;gap:1.8cqh}
.lens{width:23cqh;height:23cqh;overflow:visible}
.lglass{fill:color-mix(in srgb,var(--acc2) 7%,transparent)}
.lrim{stroke:var(--ink);stroke-width:3.6;fill:none}
.lhand{stroke:var(--acc2);stroke-width:5;stroke-linecap:round}
.ldot{position:absolute;width:23cqh;height:23cqh;border-radius:50%;
  border:.18cqh dashed color-mix(in srgb,var(--acc2) 55%,transparent);
  animation:ospinK 14s linear 29.30s infinite}
.lnum{font-family:var(--disp);font-size:3.6cqh;letter-spacing:.4cqh;color:var(--acc2)}

/* ——— SHOT E · TARGET + MIRROR ——— */
.layE{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:3cqw;align-items:center}
.ediv{width:.22cqh;height:46cqh;
  background:linear-gradient(180deg,transparent, color-mix(in srgb,var(--acc) 65%,var(--line)) 30%,
    color-mix(in srgb,var(--acc) 65%,var(--line)) 70%, transparent)}
.targW{position:relative;justify-self:center;width:46cqh;height:46cqh}
.targW svg{position:absolute;inset:0;overflow:visible}
.wedgeW{position:absolute;inset:1.2cqh;border-radius:50%;overflow:hidden;opacity:0;
  animation:fadeInK .5s linear 34.70s both}
.wedge{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg, color-mix(in srgb,var(--acc2) 40%,transparent), transparent 74deg);
  animation:wedgeK 13.9s linear 34.70s both}
@keyframes wedgeK{from{transform:rotate(0deg)}to{transform:rotate(1080deg)}}
.cdot{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:cdotK 1.6s ease-in-out 35.80s infinite alternate}
@keyframes cdotK{from{opacity:.5;transform:scale(1)}to{opacity:1;transform:scale(1.35)}}
.tagent{position:absolute;left:50%;bottom:7cqh;width:9cqh;height:9.6cqh;
  transform:translateX(-50%);opacity:0;animation:riseIn .6s var(--risek) 35.20s both}
.mirW{justify-self:center;display:flex;flex-direction:column;gap:2.2cqh;align-items:center;
  opacity:0;animation:riseIn .6s var(--risek) 42.54s both}
.mirRow{display:flex;align-items:center;gap:2.4cqw}
.mag{width:11cqh;height:11.7cqh}
.magEvil{filter:drop-shadow(0 0 1cqh color-mix(in srgb,var(--acc) 60%,transparent))}
.plat{width:10cqw;height:.24cqh;background:color-mix(in srgb,var(--line) 80%,transparent)}
.bolt{width:9cqw;height:6cqh;overflow:visible;
  filter:drop-shadow(0 0 .6cqh color-mix(in srgb,var(--acc) 60%,transparent))}

/* grain + drifting bokeh — deterministic, pure state-from-t, colors from CSS tokens */
(function(){
  var cv=document.getElementById('fx'),cx=cv.getContext('2d');
  var W=cv.width,H=cv.height,DUR=60,FPS=24,N=8,tiles=[];
  function rng(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
  function hexToRgb(h){h=h.trim();if(h[0]==='#')h=h.slice(1);
    return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  var cs=getComputedStyle(document.documentElement);
  var GOLD=hexToRgb(cs.getPropertyValue('--acc2')||'#ffb830');
  var TEAL=hexToRgb(cs.getPropertyValue('--hero')||'#3de8c0');
  for(var k=0;k<N;k++){
    var off=document.createElement('canvas');off.width=W>>1;off.height=H>>1;
    var o=off.getContext('2d'),r=rng(9137+k*761),img=o.createImageData(off.width,off.height),d=img.data;
    for(var i=0;i<d.length;i+=4){var v=(r()*255)|0;d[i]=v;d[i+1]=v;d[i+2]=v;d[i+3]=255;}
    o.putImageData(img,0,0);tiles.push(off);
  }
  var R2=rng(4242),orbs=[];
  for(var j=0;j<10;j++){orbs.push({bx:R2()*W,by:R2()*H,r:34+R2()*72,vy:6+R2()*14,
    A:22+R2()*48,ph:R2()*6.283,sp:.18+R2()*.3,a:.05+R2()*.05,c:j%3?GOLD:TEAL});}
  window.__broll={
    duration:function(){return DUR;},
    seek:function(t){
      if(!(t>=0))t=0; if(t>DUR)t=DUR;
      cx.clearRect(0,0,W,H);
      for(var j=0;j<orbs.length;j++){var b=orbs[j];
        var y=((b.by-b.vy*t)%1260+1260)%1260-90;
        var x=b.bx+b.A*Math.sin(b.sp*t+b.ph);
        var g=cx.createRadialGradient(x,y,0,x,y,b.r);
        g.addColorStop(0,'rgba('+b.c[0]+','+b.c[1]+','+b.c[2]+','+b.a+')');
        g.addColorStop(1,'rgba('+b.c[0]+','+b.c[1]+','+b.c[2]+',0)');
        cx.fillStyle=g;cx.beginPath();cx.arc(x,y,b.r,0,6.283);cx.fill();}
      var idx=Math.floor(t*FPS)%N;
      cx.globalAlpha=0.04;
      cx.drawImage(tiles[idx],0,0,W,H);
      cx.globalAlpha=1;
    }
  };
  window.__broll.seek(0);
})();
